name: Check and publish static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public content and optional JavaScript
        run: |
          python3 scripts/check.py
          node --check public/assets/copy.js
          node scripts/check-copy.mjs
      # upload-pages-artifact excludes dot directories, including our public AI guide.
      # Archive only public/ ourselves so .well-known/ is included deliberately.
      - name: Package the static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tar --dereference --hard-dereference --directory public -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" ./.well-known/agent-skills/index.json ./.well-known/agent-skills/montelibero-tfm-info/SKILL.md ./llms.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
