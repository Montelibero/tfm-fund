name: Check and publish static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public content and optional JavaScript
        run: |
          python3 scripts/check.py
          node --check public/assets/copy.js
          node scripts/check-copy.mjs
      # Check the same tar that Pages consumes, including .well-known/ and .nojekyll.
      - name: Package the static site
        run: |
          tar --dereference --hard-dereference --directory public -cf "$RUNNER_TEMP/artifact.tar" .
          python3 scripts/check-archive.py "$RUNNER_TEMP/artifact.tar"
      - name: Exercise keyboard navigation in the packaged site
        run: |
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/site"
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright-core@1.61.1
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          export CHROME_PATH="$(command -v google-chrome)"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/site.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/ -o /dev/null
          node scripts/check-browser.cjs http://127.0.0.1:8000/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
